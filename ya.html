<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Yerson Games</title>
<style>
    body {
        margin: 0;
        overflow: hidden;
        background: linear-gradient(#000000, #1a0000);
        font-family: Impact, Arial Black, sans-serif;
        color: white;
        text-align: center;
    }

    h1 {
        position: absolute;
        top: 20px;
        width: 100%;
        font-size: 50px;
        text-shadow: 0 0 20px red, 0 0 40px black;
        animation: glow 2s infinite alternate;
    }

    p {
        position: absolute;
        bottom: 30px;
        width: 100%;
        font-size: 25px;
        color: #ff4444;
        text-shadow: 0 0 10px black;
    }

    @keyframes glow {
        from { text-shadow: 0 0 10px red; }
        to { text-shadow: 0 0 30px red, 0 0 60px black; }
    }

    /* Edificio */
    .building {
        position: absolute;
        bottom: 0;
        left: 50%;
        transform: translateX(-50%);
        width: 200px;
        height: 400px;
        background: #111;
        box-shadow: 0 0 20px red;
    }

    .windows {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
        padding: 20px;
    }

    .window {
        width: 30px;
        height: 30px;
        background: #330000;
        animation: flicker 1.5s infinite;
    }

    @keyframes flicker {
        0%,100% { background: #330000; }
        50% { background: red; }
    }

    /* Rayos */
    .lightning {
        position: absolute;
        width: 4px;
        height: 200px;
        background: red;
        top: 0;
        animation: strike 1s infinite;
        opacity: 0;
    }

    .lightning.black {
        background: black;
    }

    @keyframes strike {
        0% { opacity: 0; transform: translateY(0); }
        10% { opacity: 1; }
        20% { opacity: 0; transform: translateY(200px); }
        100% { opacity: 0; }
    }
</style>
</head>
<body>

<h1>⚡ YERSON GAMES ⚡</h1>

<div class="building">
    <div class="windows">
        <div class="window"></div><div class="window"></div><div class="window"></div><div class="window"></div>
        <div class="window"></div><div class="window"></div><div class="window"></div><div class="window"></div>
        <div class="window"></div><div class="window"></div><div class="window"></div><div class="window"></div>
    </div>
</div>

<p>💀 DONEN AL PAYPAL POBRES ROTOS 💀</p>

<!-- Rayos -->
<div class="lightning" style="left: 20%; animation-delay: 0s;"></div>
<div class="lightning black" style="left: 40%; animation-delay: 0.3s;"></div>
<div class="lightning" style="left: 60%; animation-delay: 0.6s;"></div>
<div class="lightning black" style="left: 80%; animation-delay: 0.9s;"></div>

</body>
</html>
